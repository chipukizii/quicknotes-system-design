<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuickNotes API Client</title>
    <link rel="stylesheet" href="style.css" />
    <script src="api.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <div class="header-content">
        <div class="top-row">
          <p class="eyebrow" data-i18n="eyebrow">QUICKNOTES / API LAB</p>
          <div class="language-switch" role="group" aria-label="Choose language">
            <button class="language-button is-active" type="button" data-language="en" aria-pressed="true">English</button>
            <button class="language-button" type="button" data-language="sw" aria-pressed="false">Kiswahili</button>
          </div>
        </div>
        <h1 data-i18n="headline">Notes, in motion.</h1>
        <p class="tagline" data-i18n="tagline">Write notes in English or Kiswahili.</p>
      </div>
    </header>

    <main>
      <section class="composer" aria-labelledby="form-heading">
        <div class="section-heading">
          <div>
            <p class="eyebrow" data-i18n="createLabel">CREATE</p>
            <h2 id="form-heading" data-i18n="formHeading">Write a note</h2>
          </div>
          <button id="load-btn" class="secondary-button" type="button" data-i18n="loadButton">Load notes</button>
        </div>

        <form id="note-form">
          <div class="field">
            <label for="title-input" data-i18n="titleLabel">Title</label>
            <input id="title-input" name="title" type="text" placeholder="A short title" />
          </div>
          <div class="field">
            <label for="body-input" data-i18n="bodyLabel">Note</label>
            <textarea id="body-input" name="body" rows="4" placeholder="You can write in English or Kiswahili."></textarea>
          </div>
          <button id="submit-btn" type="submit" data-i18n="submitButton">Create note</button>
        </form>
      </section>

      <section class="notes-section" aria-labelledby="notes-heading">
        <div class="section-heading">
          <div>
            <p class="eyebrow" data-i18n="notesLabel">YOUR NOTES</p>
            <h2 id="notes-heading" data-i18n="notesHeading">Recent notes</h2>
          </div>
          <p id="status" class="status status--idle" role="status" aria-live="polite" data-i18n="idleStatus">Load notes to see the latest posts.</p>
        </div>
        <ul id="notes-list" aria-live="polite"></ul>
      </section>
    </main>

    <footer>
      <p data-i18n="footer">QuickNotes · Learn by building.</p>
    </footer>
  </body>
</html>
